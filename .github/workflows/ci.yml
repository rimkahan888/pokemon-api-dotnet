name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend test project
        run: dotnet restore PokemonApi.Tests/PokemonApi.Tests.csproj

      - name: Run backend tests
        run: dotnet test PokemonApi.Tests/PokemonApi.Tests.csproj --no-restore

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pokemon-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: pokemon-ui
        run: npm ci

      - name: Run frontend tests
        working-directory: pokemon-ui
        run: npm test
