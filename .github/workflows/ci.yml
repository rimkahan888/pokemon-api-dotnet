name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution dependencies
        run: dotnet restore PokemonApi.sln

      - name: Build solution
        run: dotnet build PokemonApi.sln --no-restore

      - name: Run backend tests
        run: dotnet test PokemonApi.sln --no-build

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pokemon-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: pokemon-ui
        run: npm ci

      - name: Build frontend
        working-directory: pokemon-ui
        run: npm run build

      - name: Run frontend tests
        working-directory: pokemon-ui
        run: npm test

  backend-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify formatting
        run: dotnet format PokemonApi.sln --verify-no-changes --verbosity diagnostic
